<body>
<audio id="jarvis-audio" src="JARVIS.mp3" preload="auto" playsinline></audio>
<div id="scanner-step" class="overlay">
    <div class="scanner-container">
        <p class="scan-instruction">AUTHENTIFICATION BIOMÉTRIQUE</p>
        <div id="fingerprint-target" class="fingerprint-wrapper">
            <img src="istockphoto-1480047786-612x612-removebg-preview.png" alt="Empreinte" class="print-image">
            <div class="scan-bar"></div>
        </div>
        <p class="scan-subtext">MAINTENEZ LE DOIGT SUR LE CAPTEUR</p>
    </div>
    <div id="lock-overlay" class="lock-overlay">
        <div class="lock-box">
            <span class="lock-icon">🔒</span>
        </div>
    </div>
</div>
<canvas id="three-canvas"></canvas>
<div id="nasa-terminal" class="overlay">
    <div class="terminal-box">
        <div id="terminal-content"></div>
        <span class="cursor">_</span>
    </div>
</div>
<div id="jarvis-loader" class="overlay" style="display: none;">
    <div class="hologram-container">
        <div id="circuit-board"></div>
        <div class="hologram">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="core"></div>
        </div>
    </div>
    <h2 class="jarvis-text">SYNCING WITH RACCNOX CORE...</h2>
</div>

    <header class="top-bar">
        <a href="./index.html" class="nav-link-main">PORTFOLIO // DEEP SPACE NETWORK</a>
        <div id="clock">00:00:00</div>
    </header>
    <section class="login-box" id="login-container">
        <h3>SECURITY CHECK</h3>
        <div class="input-zone">
            <label for="access-code">CODE: 0 + 1 =</label>
            <input type="text" id="access-code" maxlength="1" autocomplete="off">
        </div>
    </section>
    <nav id="main-menu" class="menu-grid" style="display: none;">
        <a href="./à propos/index.html" class="menu-item">
            <div class="item-corner"></div>

        <a href="./contact/index.html" class="menu-item">
