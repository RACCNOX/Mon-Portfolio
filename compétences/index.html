<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio / COMPÉTENCES</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap">
    <link rel="stylesheet" href="./style.css"> 
    <link rel="icon" type="image/png" href="../image/image 7.png" />
</head>

<body>
    <canvas id="matrixCanvas"></canvas>

    <div class="main-wrapper">

        <nav class="menu">
            <a href="../à propos/index.html">À propos</a>
            <a href="./index.html" class="color">Compétences</a>
            <a href="../projets/index.html">Projets</a>
            <a href="../index.html" class="menu-logo">
                <img src="../image/image 7.png" alt="Logo">
            </a>
            <a href="../expérience/index.html">Expérience</a>
            <a href="../certifications/index.html">Certifications</a>
            <a href="../contact/index.html">Contact</a>
        </nav>

        <div class="cyber-card title-card">
            <div class="corner top-left"><div class="h-line"></div><div class="v-line"></div></div>
            <div class="corner bottom-right"><div class="h-line"></div><div class="v-line"></div></div>
            <h1>COMPÉTENCES</h1>
        </div>

        <div class="skills-sections-container">
            
            <div class="skill-group">
                <h2 class="group-title">Développement Web & Scripting</h2>
                <div class="skills-grid">
                    <div class="stack-wrapper">
                        <div class="green-layer"></div>
                        <div class="black-layer skill-card-content">
                            <div class="multi-icons">
                                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="HTML">
                                <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" alt="CSS">
                            </div>
                            <span class="skill-name">HTML / CSS</span>
                            <small>Bonnes bases</small>
                            <div class="level-bar"><div class="level-fill" style="width: 70%;"></div></div>
                        </div>
                    </div>

                    <div class="stack-wrapper">
                        <div class="green-layer"></div>
                        <div class="black-layer skill-card-content">
                            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="JS">
                            <span class="skill-name">JavaScript</span>
                            <small>Notions</small>
                            <div class="level-bar"><div class="level-fill" style="width: 30%;"></div></div>
                        </div>
                    </div>

                    <div class="stack-wrapper">
                        <div class="green-layer"></div>
                        <div class="black-layer skill-card-content">
                            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python">
                            <span class="skill-name">Python</span>
                            <small>Bases</small>
                            <div class="level-bar"><div class="level-fill" style="width: 40%;"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="skill-group">
                <h2 class="group-title">Infrastructure & Réseaux</h2>
                <div class="skills-grid">
                    <div class="stack-wrapper">
                        <div class="green-layer"></div>
                        <div class="black-layer skill-card-content">
                            <img src="https://www.vectorlogo.zone/logos/virtualbox/virtualbox-icon.svg" alt="VirtualBox">
                            <span class="skill-name">Machines Virtuelles</span>
                            <div class="level-bar"><div class="level-fill" style="width: 50%;"></div></div>
                        </div>
                    </div>

                    <div class="stack-wrapper">
                        <div class="green-layer"></div>
                        <div class="black-layer skill-card-content">
                            <img src="../image/gns3-logo.png" alt="GNS3">
                            <span class="skill-name">GNS3</span>
                            <div class="level-bar"><div class="level-fill" style="width: 25%;"></div></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="skill-group">
                <h2 class="group-title">Cybersécurité & Système</h2>
                <div class="skills-grid">
                    <div class="stack-wrapper">
                        <div class="green-layer"></div>
                        <div class="black-layer skill-card-content">
                            <img src="https://www.root-me.org/IMG/logo/siteon0.svg" alt="Root-Me" class="bright-icon">
                            <span class="skill-name">Pentesting (Root-Me)</span>
                            <small>Bases</small>
                            <div class="level-bar"><div class="level-fill" style="width: 35%;"></div></div>
                        </div>
                    </div>

                    <div class="stack-wrapper">
                        <div class="green-layer"></div>
                        <div class="black-layer skill-card-content">
                            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linux/linux-original.svg" alt="Linux">
                            <span class="skill-name">Linux</span>
                            <small>Notions</small>
                            <div class="level-bar"><div class="level-fill" style="width: 35%;"></div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
